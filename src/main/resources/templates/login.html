<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>

<body>

<h2>Login</h2>

<form id="loginForm">
  <div>
    <label for="username">Username</label>
    <input type="text" id="username" required>
  </div>

  <div>
    <label for="password">Password</label>
    <input type="password" id="password" required>
  </div>

  <button type="submit">Login</button>
</form>

<p id="error" style="color:red;"></p>

<script src="/js/auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (!response.ok) {
        document.getElementById("error").innerText = "Login failed";
        return;
      }

      const data = await response.json(); // { accessToken, refreshToken }

      // auth.js의 전역 Auth 객체 사용 (토큰 저장 + 헤더 UI 갱신)
      Auth.setTokens(data.accessToken, data.refreshToken, data.nickname);

      const lang = new URL(window.location.href).searchParams.get("lang") || "en";
      window.location.href = "/?lang=" + encodeURIComponent(lang);

    } catch (err) {
      document.getElementById("error").innerText = "Login failed";
    }
  });
</script>

</body>
</html>
