<!DOCTYPE html>
<html lang="en" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.page.title}">Login - Welcome Tajikistan</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <style>
        html, body {
            background: #f5f5f5;
        }
    </style>
    <link rel="icon" th:href="@{/assets/logo/favicon.png}">
</head>

<body>
    <div class="auth-page">
        <!-- Background with overlay -->
        <div class="auth-bg"></div>
        <div class="auth-overlay"></div>

        <!-- Auth Container -->
        <div class="auth-container">
            <div class="auth-card">
                <!-- Logo -->
                <div class="auth-header-logo">
                    <a href="/" style="display: inline-flex;">
                        <img src="../assets/logo/header_logo.png" alt="Welcome Tajikistan"
                             th:attr="alt=#{site.title}" />
                    </a>
                </div>

                <!-- Header -->
                <div class="auth-header">
                    <h1 class="auth-title" th:text="#{login.title}">Welcome Back</h1>
                    <p class="auth-subtitle" th:text="#{login.subtitle}">
                        Sign in to access your favorites and profile
                    </p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form">
                    <!-- Username Field -->
                    <div class="form-group">
                        <label for="username" class="form-label">
                            <span th:text="#{login.username}">Username</span>
                            <span class="required">*</span>
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-input"
                            th:placeholder="#{login.username.placeholder}"
                            placeholder="Enter your username"
                            required
                            autocomplete="username" />
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <span th:text="#{login.password}">Password</span>
                            <span class="required">*</span>
                        </label>
                        <div class="password-group">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                th:placeholder="#{login.password.placeholder}"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password" />
                            <button
                                type="button"
                                id="passwordToggle"
                                class="password-toggle"
                                aria-label="Show password"
                                aria-controls="password"
                                aria-pressed="false">
                                <span class="material-icons" aria-hidden="true">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="error" class="form-message error" style="display: none;"></div>

                    <!-- Login Button -->
                    <button type="submit" class="form-button form-button-primary">
                        <span th:text="#{login.button}">Sign In</span>
                    </button>

                    <!-- Divider (Optional) -->
                    <!-- <div class="form-divider" th:text="#{login.divider}">or</div> -->
                </form>

                <!-- Footer Links -->
                <div class="form-footer">
                    <p>
                        <span th:text="#{login.signupPrompt}">Don't have an account?</span>
                        <a href="/auth/signup" class="form-link" th:text="#{login.signupLink}">
                            Sign Up
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Script -->
    <script src="/js/auth.js"></script>

    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");
        const passwordToggleIcon = passwordToggle.querySelector(".material-icons");

        passwordToggle.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            passwordToggle.setAttribute("aria-pressed", String(isHidden));
            passwordToggle.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            passwordToggleIcon.textContent = isHidden ? "visibility_off" : "visibility";
        });

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errorElement = document.getElementById("error");
            const submitButton = e.target.querySelector('button[type="submit"]');

            // Validation
            if (!username || !password) {
                errorElement.innerText = "Please enter username and password";
                errorElement.style.display = "block";
                return;
            }

            // Set loading state
            submitButton.disabled = true;
            submitButton.classList.add("loading");
            errorElement.style.display = "none";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const errorMsg = response.status === 401 
                        ? "Invalid username or password"
                        : "Login failed. Please try again.";
                    errorElement.innerText = errorMsg;
                    errorElement.style.display = "block";
                    return;
                }

                const data = await response.json(); // { accessToken, refreshToken, nickname }

                // Use global Auth object from auth.js (save tokens + update header UI)
                Auth.setTokens(data.accessToken, data.refreshToken, data.nickname);

                // Get language parameter and redirect
                const lang = new URL(window.location.href).searchParams.get("lang") || "en";
                setTimeout(() => {
                    window.location.href = "/?lang=" + encodeURIComponent(lang);
                }, 300);

            } catch (err) {
                console.error("Login error:", err);
                errorElement.innerText = "Login failed. Please try again.";
                errorElement.style.display = "block";
            } finally {
                // Reset loading state (in case of error)
                submitButton.disabled = false;
                submitButton.classList.remove("loading");
            }
        });
    </script>
</body>

</html>
