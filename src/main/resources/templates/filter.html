<div id="main-content">
    <!-- header -->
    <div th:replace="components/header :: header"></div>

    <main class="list-page">
        <div class="list-container">
            <header class="list-header">
                <h1 class="list-title" th:text="#{filter.page.title}">Explore Tajikistan</h1>
            </header>

            <section class="filter-panel" aria-label="Search filters">
                <form class="filter-form" action="/filter" method="get">
                    <div class="filter-input">
                        <span class="material-icons" aria-hidden="true">search</span>
                        <input
                            type="text"
                            name="query"
                            placeholder="Where do you want to go?"
                            th:placeholder="#{filter.search.placeholder}"
                            aria-label="Search keyword"
                            th:attr="aria-label=#{filter.search.aria}"
                            th:value="${lastQuery}" />
                    </div>

                    <div class="filter-select-wrap" aria-label="Select category">
                        <select class="filter-select" name="category">
                            <option value=""
                                th:selected="${lastCategory == null or #strings.isEmpty(lastCategory)}"
                                th:text="#{filter.category.all}">
                                All Categories
                            </option>

                            <option
                                th:each="c : ${categories}"
                                th:value="${c.code}"
                                th:text="${c.displayName}"
                                th:selected="${lastCategory != null and #strings.equalsIgnoreCase(c.code, lastCategory)}">
                            </option>
                        </select>
                        <span class="material-icons select-icon" aria-hidden="true">expand_more</span>
                    </div>

                    <div class="filter-select-wrap" aria-label="Select region">
                        <select class="filter-select" name="region">
                            <option value=""
                                th:selected="${lastRegion == null or #strings.isEmpty(lastRegion)}"
                                th:text="#{filter.region.all}">
                                All Regions
                            </option>

                            <option
                                th:each="r : ${regions}"
                                th:value="${r.code}"
                                th:text="${r.displayName}"
                                th:selected="${lastRegion != null and #strings.equalsIgnoreCase(r.code, lastRegion)}">
                            </option>
                        </select>
                        <span class="material-icons select-icon" aria-hidden="true">expand_more</span>
                    </div>

                    <input type="hidden" name="lang" th:value="${lang}" />

                    <button type="submit" class="filter-submit" th:text="#{filter.search.button}">Search</button>
                </form>
            </section>

            <section class="results" aria-label="Search results">
                <div class="results-meta">
                    <h2 class="results-count"
                        th:text="#{filter.results.count(${totalResults != null ? totalResults : 0})}">
                        0 Results
                    </h2>
                </div>

                <div class="card-grid">
                    <a class="place-card-link"
                       th:if="${results != null && !results.isEmpty()}"
                       th:each="place : ${results}"
                       th:with="thumbUrl=${(place.images != null and place.images.size() > 0 and place.images[0] != null) ? place.images[0].fileUrl : null},
                                backUrl=${#httpServletRequest.requestURI + (#httpServletRequest.queryString != null ? '?' + #httpServletRequest.queryString : '')}"
                       th:href="@{/detail/{id}(id=${place.placeId}, lang=${lang}, back=${backUrl})}"
                       style="text-decoration:none; color:inherit;">

                        <article class="place-card">
                            <div class="place-thumb">
                                <img th:src="${thumbUrl} ?: @{/assets/images/home_reg_2.png}"
     								alt="Place image" />


                                <span class="badge badge-top"
                                      th:text="${place.category.displayName != null ? place.category.displayName : place.category.code}">
                                    Category
                                </span>
                            </div>

                            <div class="place-body">
                                <h3 class="place-title"
                                    th:text="${place.displayI18n != null && place.displayI18n.title != null ? place.displayI18n.title : #messages.msg('place.no_title')}">
                                    Place Title
                                </h3>

                                <p class="place-desc"
                                   th:if="${place.displayI18n != null and place.displayI18n.content != null}"
                                   th:text="${place.displayI18n.content}">
                                </p>

                                <div class="place-tags">
                                    <span class="badge badge-bottom">
                                        <span class="material-icons" aria-hidden="true">location_on</span>
                                        <span
                                            th:text="${place.region.displayName != null ? place.region.displayName : place.region.code}">
                                            Region
                                        </span>
                                    </span>
                                </div>
                            </div>
                        </article>
                    </a>

                    <!-- No Results -->
                    <div th:if="${results != null && results.isEmpty()}"
                         style="padding: 24px; text-align: center; opacity: 0.8;">
                        <span th:text="#{filter.results.empty}">No matches found.</span>
                    </div>

					<!-- Before Searching -->
                    <div th:if="${results == null}"
                         style="padding: 24px; text-align: center; opacity: 0.8;">
                        <span th:text="#{filter.results.before}">Search to explore places.</span>
                    </div>
                </div>

                <nav class="pagination"
                     th:if="${totalPages != null and totalPages > 1}"
                     th:attr="aria-label=#{filter.pagination.aria}">
                    <a class="page-btn"
                       th:if="${currentPageNo > 1}"
                       th:href="@{/filter(query=${lastQuery}, category=${lastCategory}, region=${lastRegion}, lang=${lang}, page=1)}"
                       th:attr="aria-label=#{filter.pagination.first}">
                        <span class="material-icons" aria-hidden="true">first_page</span>
                    </a>

                    <a class="page-btn"
                       th:if="${startPage > 1}"
                       th:href="@{/filter(query=${lastQuery}, category=${lastCategory}, region=${lastRegion}, lang=${lang}, page=${prevBlockPage})}"
                       th:attr="aria-label=#{filter.pagination.prev}">
                        <span class="material-icons" aria-hidden="true">chevron_left</span>
                    </a>

                    <a class="page-num"
                       th:each="pageNum : ${#numbers.sequence(startPage, endPage)}"
                       th:text="${pageNum}"
                       th:classappend="${pageNum == currentPageNo} ? ' is-active' : ''"
                       th:href="@{/filter(query=${lastQuery}, category=${lastCategory}, region=${lastRegion}, lang=${lang}, page=${pageNum})}">
                        1
                    </a>

                    <a class="page-btn"
                       th:if="${endPage < totalPages}"
                       th:href="@{/filter(query=${lastQuery}, category=${lastCategory}, region=${lastRegion}, lang=${lang}, page=${nextBlockPage})}"
                       th:attr="aria-label=#{filter.pagination.next}">
                        <span class="material-icons" aria-hidden="true">chevron_right</span>
                    </a>

                    <a class="page-btn"
                       th:if="${currentPageNo < totalPages}"
                       th:href="@{/filter(query=${lastQuery}, category=${lastCategory}, region=${lastRegion}, lang=${lang}, page=${totalPages})}"
                       th:attr="aria-label=#{filter.pagination.last}">
                        <span class="material-icons" aria-hidden="true">last_page</span>
                    </a>
                </nav>
            </section>
        </div>
    </main>

    <!-- footer -->
    <div th:replace="components/footer :: footer"></div>
    </div>
