<!--  mypage_favorites.html  -->
<!DOCTYPE html>
<html lang="en" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{favorites.page.title}">My Favorite Destinations</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/filter.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <style>
        html, body {
            background: #f5f5f5;
        }

        #loading-spinner {
            display: flex;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            backdrop-filter: blur(2px);
        }

        #loading-spinner.hidden {
            display: none;
        }

        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: #008eff;
            border-radius: 50%;
            animation: spin-ring 1s linear infinite;
        }

        .spinner-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
        }

        @keyframes spin-ring {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-family: 'Pretendard', sans-serif;
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>

    <link rel="icon" th:href="@{/assets/logo/favicon.png}">
</head>

<body>
<div id="loading-spinner">
    <div class="spinner-container">
        <div class="spinner-ring"></div>
        <img class="spinner-logo" th:src="@{/assets/logo/favicon.png}" alt="Loading">
    </div>
    <div class="loading-text">Loading...</div>
</div>

<div id="main-content">
    <div th:replace="components/header :: header"></div>

    <main class="list-page">
        <div class="list-container">
            <header class="list-header">
                <h1 class="list-title">My Travel Dashboard</h1>

                <div class="dashboard-tabs" aria-label="Dashboard menu">
                    <a th:href="@{/me/favorites(lang=${lang})}" class="dashboard-tab active" aria-current="page">Favorites</a>
                    <a th:href="@{/me/calendar(lang=${lang})}" class="dashboard-tab">Calendar</a>
                </div>

                <div class="dashboard-section-header">
                    <h2 class="dashboard-section-title" th:text="#{favorites.page.title}">My Favorite Destinations</h2>
                    <p class="list-subtitle" th:text="#{favorites.page.description}">
                        A curated collection of your favorite landscapes, historical sites, and cultural treasures across Tajikistan.
                    </p>
                </div>
            </header>

            <section class="results" aria-label="Favorite destinations">
                <div class="results-meta">
                    <h2 class="results-count" id="favorites-count"
                        th:text="#{filter.results.count(0)}">
                        0 Results
                    </h2>
                </div>

                <div class="card-grid" id="favorites-grid">
                    <!-- Loaded by JavaScript -->
                </div>

                <div id="favorites-empty" style="padding: 24px; text-align: center; opacity: 0.8; display: none;">
                    <span th:text="#{favorites.empty}">No favorite destinations yet.</span>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="components/footer :: footer"></div>

    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/mypage-favorites.js}"></script>
</div>

</body>
</html>
