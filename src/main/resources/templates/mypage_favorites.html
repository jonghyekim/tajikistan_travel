<div id="main-content">
    <!-- header -->
    <div th:replace="components/header :: header"></div>

    <main class="list-page">
        <div class="list-container">
            <header class="list-header">
                <h1 class="list-title">My Travel Dashboard</h1>

				<div class="dashboard-tabs" aria-label="Dashboard menu">
				    <a th:href="@{/me/favorites}" class="dashboard-tab active" aria-current="page">Favorites</a>
				    <a th:href="@{/me/calendar}" class="dashboard-tab">Calendar</a>
				</div>

                <div class="dashboard-section-header">
                    <h2 class="dashboard-section-title" th:text="#{favorites.page.title}">My Favorite Destinations</h2>
                    <p class="list-subtitle" th:text="#{favorites.page.description}">
                        A curated collection of your favorite landscapes, historical sites, and cultural treasures across Tajikistan.
                    </p>
                </div>
            </header>

            <section class="results" aria-label="Favorite destinations">
                <div class="results-meta">
                    <h2 class="results-count" id="favorites-count"
                        th:text="#{filter.results.count(0)}">
                        0 Results
                    </h2>
                </div>

                <div class="card-grid" id="favorites-grid">
                    <!-- Loaded by JavaScript -->
                </div>

                <!-- No Favorites -->
                <div id="favorites-empty" style="padding: 24px; text-align: center; opacity: 0.8; display: none;">
                    <span th:text="#{favorites.empty}">No favorite destinations yet.</span>
                </div>
            </section>
        </div>
    </main>

    <!-- footer -->
    <div th:replace="components/footer :: footer"></div>
    <script th:src="@{/js/auth.js}"></script>
