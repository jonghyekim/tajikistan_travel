<!--  emergency_contacts.html  -->
<!DOCTYPE html>
<html lang="en" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{emergency.page.title}">Emergency Contacts</title>

    <!-- for google material icon -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
		<link rel="stylesheet" th:href="@{/css/emergency_contacts.css}">
		<link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/skeleton.css}">
    <style>
        html, body { background: #f5f5f5; }
    </style>
    <script defer th:src="@{/js/skeleton.js}"></script>
    <noscript>
        <style>
            #loading-skeleton { display: none !important; }
            #main-content { visibility: visible !important; opacity: 1 !important; }
        </style>
    </noscript>
    <link rel="icon" th:href="@{/assets/logo/favicon.png}">

</head>

<body class="skeleton-pending" data-skeleton-kind="emergency">
    <div id="loading-skeleton" data-kind="emergency">
        <div class="sk-header">
            <div class="skeleton-box sk-logo"></div>
            <div class="skeleton-box sk-nav"></div>
            <div class="skeleton-box sk-lang-group"></div>
        </div>

        <div class="sk-container" style="margin-top:120px;">
            <div class="skeleton-box sk-title-sm"></div>
            <div class="sk-contact-list">
                <div class="sk-contact-card">
                    <div class="sk-contact-main">
                        <div class="skeleton-box sk-contact-title"></div>
                        <div class="skeleton-box sk-contact-desc"></div>
                    </div>
                    <div class="skeleton-box sk-contact-badge"></div>
                    <div class="skeleton-box sk-contact-action"></div>
                </div>
                <div class="sk-contact-card">
                    <div class="sk-contact-main">
                        <div class="skeleton-box sk-contact-title"></div>
                        <div class="skeleton-box sk-contact-desc"></div>
                    </div>
                    <div class="skeleton-box sk-contact-badge"></div>
                    <div class="skeleton-box sk-contact-action"></div>
                </div>
                <div class="sk-contact-card">
                    <div class="sk-contact-main">
                        <div class="skeleton-box sk-contact-title"></div>
                        <div class="skeleton-box sk-contact-desc"></div>
                    </div>
                    <div class="skeleton-box sk-contact-badge"></div>
                    <div class="skeleton-box sk-contact-action"></div>
                </div>
                <div class="sk-contact-card">
                    <div class="sk-contact-main">
                        <div class="skeleton-box sk-contact-title"></div>
                        <div class="skeleton-box sk-contact-desc"></div>
                    </div>
                    <div class="skeleton-box sk-contact-badge"></div>
                    <div class="skeleton-box sk-contact-action"></div>
                </div>
            </div>
        </div>

        <div class="sk-footer">
            <div class="sk-footer-top">
                <div class="skeleton-box sk-f-logo"></div>
                <div class="skeleton-box sk-f-nav"></div>
                <div class="skeleton-box sk-f-lang"></div>
            </div>
            <div class="skeleton-box sk-f-line"></div>
        </div>
    </div>

    <div id="main-content">
    <!-- header -->
    <div th:replace="components/header :: header"></div>

    <!-- Emergency Contacts Page -->
    <main class="emergency-page">
        <div class="emergency-container">
            <!-- Title -->
            <header class="emergency-header">
                <h1 class="emergency-title" th:text="#{emergency.page.title}">Emergency Contacts</h1>
            </header>


            <!-- Results -->
            <section class="results" aria-label="Emergency contacts list">


                <!-- Contact List -->
                <div class="contact-list">
                    <article class="contact-card" th:each="contact : ${contacts}">
                        <div class="contact-info">
                            <h3 class="contact-title" th:text="${contact.displayI18n.title}">General Emergency</h3>
                            <p class="contact-desc" th:text="${contact.displayI18n.description}">
                                Universal emergency line (Police / Ambulance / Fire)
                            </p>
                        </div>
                        <div class="contact-badge">
                            <span class="badge"
                                  th:classappend="'badge-' + ${contact.badgeType}"
                                  th:text="${contact.displayI18n.badgeLabel}">
                                Emergency
                            </span>
                        </div>
                        <a href="tel:112" class="contact-phone" th:href="'tel:' + ${contact.phoneDial}">
                            <span class="material-icons" aria-hidden="true">call</span>
                            <span th:text="${contact.phoneDisplay}">112</span>
                        </a>
                    </article>
                </div>
            </section>
        </div>
    </main>

    <!-- footer -->
    <div th:replace="components/footer :: footer"></div>
    </div>
</body>

</html>
