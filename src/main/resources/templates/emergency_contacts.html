<!--  emergency_contacts.html  -->
<!DOCTYPE html>
<html lang="en" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{emergency.page.title}">Emergency Contacts</title>

    <!-- for google material icon -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
		<link rel="stylesheet" th:href="@{/css/emergency_contacts.css}">
		<link rel="stylesheet" th:href="@{/css/footer.css}">
    <style>
        html, body {
            background: #f5f5f5;
        }

        #loading-spinner {
            display: flex;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            backdrop-filter: blur(2px);
        }

        #loading-spinner.hidden {
            display: none;
        }

        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: #008eff;
            border-radius: 50%;
            animation: spin-ring 1s linear infinite;
        }

        .spinner-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
        }

        @keyframes spin-ring {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-family: 'Pretendard', sans-serif;
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
    <link rel="icon" th:href="@{/assets/logo/favicon.png}">

</head>

<body>
<div id="loading-spinner">
    <div class="spinner-container">
        <div class="spinner-ring"></div>
        <img th:src="@{/assets/logo/favicon.png}" alt="Loading" class="spinner-logo" />
    </div>
    <div class="loading-text">Loading...</div>
</div>

<div id="main-content">
    <!-- header -->
    <div th:replace="components/header :: header"></div>

    <!-- Emergency Contacts Page -->
    <main class="emergency-page">
        <div class="emergency-container">
            <!-- Title -->
            <header class="emergency-header">
                <h1 class="emergency-title" th:text="#{emergency.page.title}">Emergency Contacts</h1>
            </header>


            <!-- Results -->
            <section class="results" aria-label="Emergency contacts list">


                <!-- Contact List -->
                <div class="contact-list">
                    <article class="contact-card" th:each="contact : ${contacts}">
                        <div class="contact-info">
                            <h3 class="contact-title" th:text="${contact.displayI18n.title}">General Emergency</h3>
                            <p class="contact-desc" th:text="${contact.displayI18n.description}">
                                Universal emergency line (Police / Ambulance / Fire)
                            </p>
                        </div>
                        <div class="contact-badge">
                            <span class="badge"
                                  th:classappend="'badge-' + ${contact.badgeType}"
                                  th:text="${contact.displayI18n.badgeLabel}">
                                Emergency
                            </span>
                        </div>
                        <a href="tel:112" class="contact-phone" th:href="'tel:' + ${contact.phoneDial}">
                            <span class="material-icons" aria-hidden="true">call</span>
                            <span th:text="${contact.phoneDisplay}">112</span>
                        </a>
                    </article>
                </div>
            </section>
        </div>
    </main>

    <!-- footer -->
    <div th:replace="components/footer :: footer"></div>
    </div>

    <script>
        function hideLoading() {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) {
                spinner.classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', hideLoading);
    </script>
</body>

</html>
