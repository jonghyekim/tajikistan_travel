server:
  port: 8080

spring:
  config:
    import: 
      - classpath:/yaml/application-keys.yaml

  main:
    allow-bean-definition-overriding: true

  jpa:
    open-in-view: false
    show-sql: true           
    hibernate:
      ddl-auto: update       
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
          
deepl:
  base-url: https://api-free.deepl.com
  api-key: ${deepl.api-key}

jwt:
  secret: "x9ByZQv4lJ9oH5z8K0a7Rk7pQ+0V0mE0X8sN5fLwCkA="
  access-exp-seconds: 900       #15 minutes
  refresh-exp-seconds: 1209600  #14 days
